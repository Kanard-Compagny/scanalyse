ShortDescription: Free toolbox for barcode technicians, all brands.
Description: |-
  Scanalyse reads and explains barcodes (GS1, QR, Data Matrix…), compares what a scanner really sends with the code's content, reads and checks label printer programs and configuration files (ZPL, TSPL, EPL2, DPL, SBPL, Fingerprint, TPCL) and sends them to the printer.
  100% local analysis: no image or data is sent over the Internet.
