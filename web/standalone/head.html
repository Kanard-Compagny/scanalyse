<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scanalyse</title>
<meta name="description" content="Analyser et créer des codes-barres sur téléphone, sans rien installer : tout reste sur l'appareil.">
<meta name="theme-color" content="#0F3D2E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scanalyse">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
/* Sur téléphone, on arrive sur « Analyser » la première fois ; ensuite le dernier onglet est repris. */
try{if(!location.hash&&!localStorage.getItem("atelier-mode"))localStorage.setItem("atelier-mode","scan");}catch(e){}
</script>
<style>
body{margin:0;padding:0!important}img{max-width:100%}
.wrap{padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
/* Barre de l'application, aux couleurs du programme Windows */
.app-bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;background:#0F3D2E;color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.app-logo{width:30px;height:30px;flex:none}
.app-bar b{font:700 19px/1 -apple-system,"Segoe UI",Roboto,system-ui,sans-serif;letter-spacing:-.01em}
.app-bar nav{margin-left:auto;display:flex;align-items:center;gap:6px}
.app-bar button,.app-bar a{font:600 14px -apple-system,"Segoe UI",Roboto,system-ui,sans-serif;color:#D6E6DE;background:rgba(255,255,255,.08);
  border:0;border-radius:999px;padding:7px 12px;text-decoration:none;cursor:pointer}
.app-bar button:focus-visible,.app-bar a:focus-visible{outline:2px solid #F07F13;outline-offset:2px}
/* Le titre « Atelier » et sa description laissent la place aux deux onglets, en bas de l'écran comme une application */
header h1,#headDesc{display:none}
header{margin:0}
@media (max-width:760px){
  header .modes{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:0;border-radius:0;border:0;border-top:1px solid var(--line);
    background:var(--panel);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  header .modes button{flex:1;padding:12px 8px;font-size:15px;border-radius:10px}
  .wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))!important}
  #tabScan{order:-1}
}
/* Écran tactile : la caméra d'abord ; capture d'écran, raccourcis clavier et démonstration n'y ont pas de sens */
@media (pointer:coarse){#scanScreen,#pasteHint,#scanSample{display:none!important}#scanCam{order:-1}}
@media (min-width:761px){header{padding-top:4px}}
</style>
