<!-- Version téléphone : écrans propres au mobile, posés sur l'Atelier (moteur de lecture et analyse détaillée) -->
<div class="m-bar">
  <svg class="m-logo" aria-hidden="true" viewBox="0 0 1024 1024"><use href="#m-logo-art"/></svg>
  <b>Scanalyse</b>
  <button type="button" class="m-back" id="mBack" hidden data-en="Back">Retour</button>
  <nav><button type="button" id="mLang" lang="en">English</button><a href="../" id="mSite">Site</a></nav>
</div>

<main class="m-screens">
  <!-- Scanner : la caméra occupe tout l'écran -->
  <section class="m-screen m-scan" id="mScan">
    <video id="mVideo" playsinline muted autoplay></video>
    <div class="m-finder" id="mFinder" aria-hidden="true"><i></i></div>
    <p class="m-hint" id="mHint" data-en="Aim at a code">Vise un code</p>
    <div class="m-camtools">
      <label class="m-round" for="mPhoto"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg><span data-en="Photo">Photo</span></label>
      <input type="file" id="mPhoto" accept="image/*" hidden>
      <button type="button" class="m-round" id="mTorch" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2h6l-1 7h-4zM10 9h4v13h-4z"/></svg><span data-en="Light">Lampe</span></button>
    </div>
    <div class="m-camoff" id="mCamOff" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <p id="mCamMsg"></p>
      <button type="button" class="m-btn m-primary" id="mCamStart" data-en="Open the camera">Ouvrir la caméra</button>
      <label class="m-btn" for="mPhoto" data-en="Analyze a photo">Analyser une photo</label>
    </div>
  </section>

  <!-- Créer : les types courants, puis un écran de saisie simple -->
  <section class="m-screen m-page" id="mCreate" hidden>
    <h1 data-en="Create a code">Créer un code</h1>
    <div class="m-tiles" id="mTiles"></div>
    <button type="button" class="m-more" id="mAll" data-en="All types and options (colors, logo…)">Tous les types et options (couleurs, logo…)</button>
  </section>

  <section class="m-screen m-page" id="mEdit" hidden>
    <h1 id="mEditTitle"></h1>
    <div class="m-preview" id="mPreview"><img id="mCode" alt=""></div>
    <p class="m-check" id="mCheck"></p>
    <div class="m-actions">
      <button type="button" class="m-btn m-primary" id="mFull" data-en="Show full screen">Afficher en grand</button>
      <button type="button" class="m-btn" id="mShare" data-en="Share">Partager</button>
      <button type="button" class="m-btn" id="mSave" data-en="Save the image">Enregistrer l'image</button>
    </div>
    <form class="m-form" id="mForm" autocomplete="off"></form>
  </section>

  <!-- Historique des lectures, gardé sur le téléphone -->
  <section class="m-screen m-page" id="mHistory" hidden>
    <h1 data-en="History">Historique</h1>
    <p class="m-muted" data-en="The last 50 reads, kept on this phone only.">Les 50 dernières lectures, gardées sur ce téléphone uniquement.</p>
    <ol class="m-list" id="mList"></ol>
    <button type="button" class="m-more" id="mClear" data-en="Clear the history">Effacer l'historique</button>
  </section>

</main>

<!-- Résultat d'une lecture -->
<div class="m-sheet" id="mSheet" hidden role="dialog" aria-modal="true" aria-labelledby="mSheetType">
  <div class="m-sheet-in">
    <div class="m-grip" aria-hidden="true"></div>
    <div class="m-sheet-head"><span class="m-chip" id="mSheetType"></span><span class="m-muted" id="mSheetMeta"></span></div>
    <p class="m-value" id="mSheetValue"></p>
    <dl class="m-ai" id="mSheetAi"></dl>
    <div class="m-actions">
      <button type="button" class="m-btn m-primary" id="mAgain" data-en="Scan again">Lire un autre code</button>
      <button type="button" class="m-btn" id="mCopy" data-en="Copy">Copier</button>
      <button type="button" class="m-btn" id="mDetailsBtn" data-en="Detailed analysis">Analyse détaillée</button>
      <a class="m-btn" id="mOpen" target="_blank" rel="noopener noreferrer" hidden data-en="Open the link">Ouvrir le lien</a>
      <button type="button" class="m-btn" id="mRecreate" data-en="Recreate this code">Recréer ce code</button>
    </div>
  </div>
</div>

<!-- Code en plein écran, pour le faire scanner -->
<div class="m-fullscreen" id="mFullscreen" hidden><img id="mFullImg" alt=""><p data-en="Tap to close · turn the brightness up if the scanner struggles">Touche pour fermer · monte la luminosité si la douchette peine</p></div>

<p class="m-toast" id="mToast" role="status" aria-live="polite"></p>

<nav class="m-tabs" aria-label="Scanalyse">
  <button type="button" data-go="mScan" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M10 8v8M13 8v8M16 8v8"/></svg><span data-en="Scan">Lire</span></button>
  <button type="button" data-go="mCreate"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v7h-7"/></svg><span data-en="Create">Créer</span></button>
  <button type="button" data-go="mHistory"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 3"/></svg><span data-en="History">Historique</span></button>
</nav>
