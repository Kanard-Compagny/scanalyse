# Compilation automatique : tests à chaque envoi, exécutable portable téléchargeable.
# Pour publier une version : Actions → Compilation → « Run workflow », saisir la version (ex. 0.10.0) ;
# ou créer un tag vX.Y.Z. L'exécutable est alors joint à une « Release » GitHub.
name: Compilation

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publier:
        description: "Version à publier (ex. 0.10.0) : crée l'étiquette vX.Y.Z et la Release avec Scanalyse.exe. Vide : simple compilation."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Tests du cœur d'analyse
        run: dotnet test tests/Scanalyse.Core.Tests -c Release

      - name: Version
        id: version
        shell: pwsh
        run: |
          $prefix = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.VersionPrefix
          $publish = "${{ github.event.inputs.publier }}".Trim().TrimStart("v")
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          elseif ($publish) { $v = $publish }
          else { $v = "$prefix-dev.${{ github.run_number }}" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Exécutable portable
        run: dotnet publish src/Scanalyse.Desktop -p:PublishProfile=Portable -p:Version=${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@v4
        with:
          name: Scanalyse-${{ steps.version.outputs.value }}
          path: src/Scanalyse.Desktop/bin/Portable/Scanalyse.exe

      - name: Release
        if: github.ref_type == 'tag' || github.event.inputs.publier != ''
        uses: softprops/action-gh-release@v2
        with:
          # Bouton « Run workflow » : l'étiquette vX.Y.Z est créée sur ce commit si elle n'existe pas.
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: Scanalyse ${{ steps.version.outputs.value }}
          body_path: CHANGELOG.md
          files: src/Scanalyse.Desktop/bin/Portable/Scanalyse.exe
