# Compilation automatique : tests à chaque envoi, exécutable portable téléchargeable.
# Publication automatique : un envoi sur main dont la version (VersionPrefix de Directory.Build.props) n'a pas encore
# d'étiquette vX.Y.Z crée l'étiquette et la « Release » GitHub avec Scanalyse.exe. Sinon, compilation « -dev ».
# Autres moyens : Actions → Compilation → « Run workflow » en saisissant la version (ex. 0.12.0), ou créer un tag vX.Y.Z.
name: Compilation

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publier:
        description: "Version à publier (ex. 0.10.0) : crée l'étiquette vX.Y.Z et la Release avec Scanalyse.exe. Vide : simple compilation."
        required: false
        default: ""

permissions:
  contents: write

# Une compilation à la fois par branche : deux envois rapprochés ne publient pas deux fois la même version.
concurrency:
  group: compilation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Tests du cœur d'analyse
        run: dotnet test tests/Scanalyse.Core.Tests -c Release

      - name: Version
        id: version
        shell: pwsh
        run: |
          $prefix = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.VersionPrefix
          $publish = "${{ github.event.inputs.publier }}".Trim().TrimStart("v")
          $release = "false"
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          elseif ($publish) { $v = $publish }
          else {
            $v = "$prefix-dev.${{ github.run_number }}"
            # Envoi sur main avec une version encore jamais publiée : publication automatique.
            if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -eq "refs/heads/main") {
              $existing = git ls-remote --tags origin "refs/tags/v$prefix"
              if ($LASTEXITCODE -eq 0 -and -not $existing) { $v = $prefix; $release = "true" }
            }
          }
          "value=$v" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT

      - name: Exécutable portable
        run: dotnet publish src/Scanalyse.Desktop -p:PublishProfile=Portable -p:Version=${{ steps.version.outputs.value }}

      - name: Exécutable à compiler
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scanalyse-${{ steps.version.outputs.value }}
          path: src/Scanalyse.Desktop/bin/Portable/Scanalyse.exe

      # Signature du code (SignPath Foundation), uniquement pour une version publiée et seulement une fois SignPath
      # configuré (variables SIGNPATH_* et secret SIGNPATH_API_TOKEN du dépôt, voir docs/SIGNATURE.md).
      # Tant que ce n'est pas le cas, l'exécutable est publié sans signature, comme avant.
      - name: Signature (SignPath)
        id: signature
        if: >-
          (github.ref_type == 'tag' || github.event.inputs.publier != '' || steps.version.outputs.release == 'true')
          && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.artifact.outputs.artifact-id }}
          wait-for-completion: true
          # La signature attend la validation manuelle de la version sur SignPath (jusqu'à 4 h).
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signe

      - name: Fichiers de la version
        if: github.ref_type == 'tag' || github.event.inputs.publier != '' || steps.version.outputs.release == 'true'
        shell: pwsh
        env:
          SIGNATURE: ${{ steps.signature.outcome }}
        run: |
          # Erreur détaillée en annotation (lisible sans ouvrir le journal complet).
          trap { Write-Host "::error::$(($_ | Out-String) -replace "`r?`n", ' ')"; exit 1 }
          New-Item -ItemType Directory -Force publication | Out-Null
          $notes = ""
          if ($env:SIGNATURE -eq "success") {
            # Exécutable signé (dossier ou archive renvoyés par SignPath). Introuvable ou signature invalide :
            # la publication s'arrête, rien n'est diffusé.
            Get-ChildItem signe -Recurse -Filter *.zip | ForEach-Object { Expand-Archive $_.FullName -DestinationPath signe -Force }
            $signed = Get-ChildItem signe -Recurse -Filter Scanalyse.exe | Select-Object -First 1
            if (-not $signed) { throw "Exécutable signé introuvable dans le retour de SignPath." }
            $sig = Get-AuthenticodeSignature $signed.FullName
            if ($sig.Status -ne "Valid") { throw "Signature invalide : $($sig.Status) $($sig.StatusMessage)" }
            Copy-Item $signed.FullName publication/Scanalyse.exe
            $notes = "Exécutable signé. Signature gratuite fournie par [SignPath.io](https://about.signpath.io), certificat de [SignPath Foundation](https://signpath.org) — voir la [politique de signature du code](https://github.com/${{ github.repository }}#code-signing-policy).`n`n"
          } else {
            Copy-Item src/Scanalyse.Desktop/bin/Portable/Scanalyse.exe publication/Scanalyse.exe
          }
          # Empreinte SHA-256 : publiée dans les notes et en fichier (format sha256sum), vérifiée par la mise à jour automatique.
          $hash = (Get-FileHash publication/Scanalyse.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path publication/Scanalyse.exe.sha256 -Value "$hash  Scanalyse.exe`n" -Encoding ascii -NoNewline
          $notes = "**SHA-256 de Scanalyse.exe** : ``$hash```n`n" + $notes
          Set-Content -Path publication/notes.md -Value ($notes + (Get-Content -Raw -Encoding utf8 CHANGELOG.md)) -Encoding utf8

      - name: Release
        if: github.ref_type == 'tag' || github.event.inputs.publier != '' || steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # Bouton « Run workflow » ou publication automatique : l'étiquette vX.Y.Z est créée sur ce commit si elle n'existe pas.
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: Scanalyse ${{ steps.version.outputs.value }}
          body_path: publication/notes.md
          files: |
            publication/Scanalyse.exe
            publication/Scanalyse.exe.sha256
